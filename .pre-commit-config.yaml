# Hooks are managed with prek (a drop-in pre-commit replacement, same file format).
# Run once per clone:  prek install
repos:
  - repo: local
    hooks:
      - id: config-invariants
        name: opencode config invariants
        entry: skills/update-opencode-config/check-config.py
        language: script
        pass_filenames: false
        always_run: true
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: pretty-format-json
        # 2 spaces matches what opencode and these scripts write, so the hook
        # does not fight them on every commit.
        args: [--autofix, --no-sort-keys, --indent=2]
      - id: check-symlinks
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: detect-private-key
